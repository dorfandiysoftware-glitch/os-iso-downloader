name: peek
on:
  workflow_dispatch:
jobs:
  fido:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fido parse part
        run: |
          curl -sSL https://raw.githubusercontent.com/pbatard/Fido/master/Fido.ps1 -o Fido.ps1
          sed -n '136,162p;770,800p' Fido.ps1 | cut -c1-220
      - name: Try the Microsoft flow from CI
        run: python3 tools/ms_probe.py
