name: peek
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/probe2.py uup
        continue-on-error: true
      - run: python3 tools/probe2.py archive
        continue-on-error: true
      - run: python3 tools/probe2.py distro
        continue-on-error: true
